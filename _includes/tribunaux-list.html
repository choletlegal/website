<!--- Liste éditoriale des tribunaux administratifs — lit _data/tribunaux.yml.
      Même patron visuel que domaines-list.html (.domaines-list/.domaine-row),
      réutilisé tel quel plutôt que dupliqué avec de nouvelles classes. -->
<div class="domaines-list">
  {% for tribunal in site.data.tribunaux.tribunaux %}
  <article class="domaine-row">
    <span class="domaine-index" aria-hidden="true">{{ forloop.index | prepend: '0' | slice: -2, 2 }}</span>
    <div>
      <h3>{{ tribunal.nom }}</h3>
      <p>Ressort : {{ tribunal.ressort }}.</p>
    </div>
    <a class="link-arrow" href="{{ tribunal.url }}">En savoir plus <span aria-hidden="true">→</span></a>
  </article>
  {% endfor %}
</div>
