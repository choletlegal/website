<!--- Bandeau CTA de fin de page — fond clair, cadré d'un filet, accent bordeaux
      réservé au bouton et au mot mis en emphase (cf. CLAUDE.md, Direction visuelle). -->
{% assign author = site.data.author.author %}
<section class="accent-band">
  <div class="wrap accent-band-grid">
    <div>
      <h2>Prenez <em>rendez-vous</em> dès aujourd'hui</h2>
    </div>
    <div class="accent-band-actions">
      <a class="action-btn action-btn-accent" href="/contact/">Prendre rendez-vous</a>
      <a class="action-btn action-btn-outline" href="tel:{{ author.phone | replace: ' ', '' }}">{{ author.phone }}</a>
    </div>
  </div>
</section>
