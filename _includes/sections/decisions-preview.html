<!--- Aperçu "Décisions obtenues" (accueil) — boucle sur site.decisions
      (triée par date décroissante, limitée à 3). -->
{% assign recent_decisions = site.decisions | sort: "date" | reverse | limit: 3 %}
<section class="section section--tint">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Décisions obtenues</span>
      <h2>Des résultats concrets devant les juridictions</h2>
    </div>

    <div class="proof-list">
      {% for decision in recent_decisions %}
      {% include decision-row.html decision=decision %}
      {% endfor %}
    </div>
  </div>
</section>
